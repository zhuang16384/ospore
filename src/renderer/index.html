<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ospore</title>
    <!--
      Main-document CSP. `frame-src ospore:` is required because `default-src`
      would otherwise fall back to 'self' and block the html document iframe.
      https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ospore:; frame-src ospore:; object-src 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
